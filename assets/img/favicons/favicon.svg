<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="canopyMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="canopyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- 둥근 사각형 배경 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- 줄기/기둥 -->
  <rect x="56" y="72" width="16" height="32" rx="6" fill="#854d0e" />
  <path d="M56 80 L46 70" stroke="#854d0e" stroke-width="5" stroke-linecap="round" />
  <path d="M72 78 L81 69" stroke="#854d0e" stroke-width="5" stroke-linecap="round" />

  <!-- 브로콜리/나무 풍성한 잎사귀(숲) -->
  <circle cx="43" cy="59" r="20" fill="url(#canopyDark)" />
  <circle cx="85" cy="59" r="20" fill="url(#canopyDark)" />
  <circle cx="64" cy="44" r="24" fill="url(#canopyMain)" />
  <circle cx="52" cy="64" r="18" fill="#22c55e" />
  <circle cx="76" cy="64" r="18" fill="#22c55e" />

  <!-- 하이라이트 -->
  <circle cx="56" cy="36" r="5" fill="#86efac" opacity="0.7" />
  <circle cx="36" cy="52" r="3.5" fill="#86efac" opacity="0.6" />
</svg>

