# 사이트 전체 설정 파일 (_config.yml)

# 사용할 Jekyll 테마
theme: jekyll-theme-chirpy

# 웹페이지 기본 언어 설정 (_data/locales 폴더의 파일명과 일치하면 해당 언어팩이 적용됨)
lang: ko-KR

# 표준 시간대 설정
timezone: Asia/Seoul

# jekyll-seo-tag 메타데이터 설정
# ↓ --------------------------

# 블로그 대표 제목 (개인 이름 없이 깔끔한 기술블로그 이름)
title: "sungashell"

# 블로그 부제 (한 줄 소개)
tagline: "문제의 원인을 끝까지 추적하는 인프라 · 클라우드 기술블로그"

# 검색엔진(SEO) 및 RSS 피드에 노출될 블로그 설명
description: >-
  클라우드 · 인프라 · 쿠버네티스 환경에서 마주친 트러블슈팅 기록(syslog), 핵심 기술 개념(root), 알아두면 쓸모 있는 잡학 IT 지식(stdout)을 정리합니다.

# 사이트 기본 URL (끝에 '/'를 붙이지 않음)
url: "https://sungahbak.github.io"

github:
  username: sungahbak

# 작성자 및 하단 저작권(Copyright) 표기 설정
social:
  name: sungashell
  email: # 스팸 방지를 위해 비워두거나 필요 시 입력
  fediverse_handle:
  links:
    # 첫 번째 링크가 푸터 저작권자 대표 링크로 사용됨
    - https://github.com/sungahbak

# 검색엔진 웹마스터 소유권 확인 코드 설정
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------

# 웹 분석 도구 설정
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# 조회수 카운터 설정
pageviews:
  provider:

# 색상 테마 설정 (토스 기술블로그 스타일에 맞춰 라이트 모드 고정)
theme_mode: light

# 미디어 리소스용 CDN 엔드포인트
cdn:

# 프로필 아바타 이미지 경로
avatar:

# 기본 소셜 미리보기(OG) 이미지
social_preview_image:

# 포스트 본문 우측 목차(TOC) 전역 활성화 여부
toc: true

actions:
  # 포스트 하단 "글 수정하기" 링크 노출 여부
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  # 댓글 시스템 설정 (비워두면 비활성화)
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# 정적 에셋 자체 호스팅 여부
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true # PWA 설치 기능 활성화
  cache:
    enabled: false # 파비콘/타이틀 등 변경사항이 즉시 반영되도록 오프라인 캐시 비활성화
    deny_paths:

# 홈 화면 페이지당 최대 포스트 개수 (최대 6개)
paginate: 6

# 사이트 하위 경로 (루트 도메인이므로 빈 문자열)
baseurl: ""

# ------------ 아래 옵션들은 테마 내부 동작을 위한 설정이므로 수정을 권장하지 않음 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
